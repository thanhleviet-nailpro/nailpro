*{box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;background:#121214;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #333}
.mode-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.m-btn{background:#1e1e22;color:#888;border:1px solid #333;padding:10px;border-radius:12px;font-size:15px;font-weight:bold}
.m-btn.on{background:#ff7eb3;color:#000;border-color:#ff7eb3}
.view{display:none;flex:1;flex-direction:column;overflow:hidden}
.view.on{display:flex}
.box{flex:1;background:#1e1e22;border-radius:14px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto}
.orig{font-size:16px;color:#ccc;margin:4px 0 8px}
.trans{font-size:22px;font-weight:bold;color:#4cd964}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:4px;flex-shrink:0}
.tab{background:#1e1e22;color:#aaa;border:1px solid #333;padding:8px 11px;border-radius:10px;font-size:13px;font-weight:bold;white-space:nowrap;flex-shrink:0}
.tab.on{background:#64d2ff;color:#000;border-color:#64d2ff}
.list{display:none;flex-wrap:wrap;gap:6px;height:125px;overflow-y:auto;align-content:flex-start;flex-shrink:0}
.list.on{display:flex}
.chip{background:#2c2c30;color:#fff;border:1px solid #444;padding:8px 10px;border-radius:10px;font-size:13px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 0 8px;flex-shrink:0}
.mic{border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:bold;color:#fff}
.rec{background:#ff9f0a!important;color:#000}
.card{flex:1;background:#1e1e22;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #2c2c30;overflow-y:auto}
.vi-m{font-size:15px;color:#ffd60a;font-weight:600}
.en-t{font-size:22px;font-weight:bold;color:#fff;margin:6px 0;line-height:1.25}
.phon{font-size:16px;color:#64d2ff;background:#121214;padding:8px 10px;border-radius:10px;border-left:4px solid #64d2ff}
.aud-r{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.b-aud{background:#2c2c30;color:#fff;border:1px solid #444;padding:11px;border-radius:10px;font-size:14px;font-weight:bold}
.prac{margin-top:10px;background:#161618;padding:10px;border-radius:12px;text-align:center}

.b-mic.rec{background:#ff9f0a;color:#000}
.res-t{margin-top:6px;font-size:13px;min-height:20px;color:#ccc}
.nav{display:flex;gap:10px;padding:8px 0 6px;flex-shrink:0}
.b-nav{flex:1;background:#2c2c30;color:#fff;border:none;padding:13px;border-radius:12px;font-size:15px;font-weight:bold}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);padding:20px;justify-content:center;align-items:center;z-index:99}
.mb{background:#1e1e22;padding:20px;border-radius:14px;width:100%;max-width:340px}
input{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #444;background:#121214;color:#fff}

<script>
var lt="",ll="en-US",SR=window.SpeechRecognition||window.webkitSpeechRecognition,rc=SR?new SR():null;
function setMode(m){
  document.getElementById('m1').classList.toggle('on',m===1);
  document.getElementById('m2').classList.toggle('on',m===2);
  document.getElementById('v1').classList.toggle('on',m===1);
  document.getElementById('v2').classList.toggle('on',m===2);
}
function tab(n,e){
  document.querySelectorAll('#v1 .list').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('#v1 .tab').forEach(x=>x.classList.remove('on'));
  document.getElementById('t'+n).classList.add('on');e.classList.add('on');
}
function openM(){document.getElementById('ki').value=localStorage.getItem('gk')||'';document.getElementById('md').style.display='flex'}
function saveM(){
  var cleanKey = document.getElementById('ki').value.replace(/\s+/g, '');
  localStorage.setItem('gk', cleanKey);
  document.getElementById('md').style.display='none';
  alert("Đã lưu Key sạch sẽ!");
}

function spk(x,l){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(x);u.lang=l;u.rate=.95;window.speechSynthesis.speak(u)}
function reSpk(){if(lt)spk(lt,ll)}
function say(e,v){document.getElementById('o').innerText=v;document.getElementById('t').innerText=e;lt=e;ll='en-US';spk(e,'en-US')}

function mic(l){
  if(!rc)return alert("Mở bằng Safari trên iPhone!");
  var k=(localStorage.getItem('gk')||'').replace(/\s+/g, '');
  if(!k)return openM();
  document.getElementById('bE').classList.remove('rec');document.getElementById('bV').classList.remove('rec');
  document.getElementById(l=='en-US'?'bE':'bV').classList.add('rec');
  document.getElementById('o').innerText="Đang nghe...";document.getElementById('t').innerText="...";
  try{rc.abort()}catch(e){}
  rc.lang=l;
  rc.onresult=async function(e){
    var tx=e.results.item(0).item(0).transcript;
    document.getElementById('o').innerText=tx;
    document.getElementById('bE').classList.remove('rec');document.getElementById('bV').classList.remove('rec');
        var p="Dịch sang "+(l=='en-US'?'Tiếng Việt':'Tiếng Anh Mỹ tiệm nail')+" (chỉ trả về câu dịch): "+tx;
        var domain = ["generativelanguage", "googleapis", "com"].join(".");
    var models = ["gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-3.1-flash-lite", "gemini-flash-latest"];
    setTimeout(async function(){
      var success = false;
      var lastErr = "";
      for (var i = 0; i < models.length; i++) {
        var apiUrl = "https://" + domain + "/v1beta/models/" + models[i] + ":generateContent?key=" + k;
        try {
          var r = await fetch(apiUrl, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({contents:[{parts:[{text:p}]}]})
          });
          var d = await r.json();
          if (r.ok && !d.error && d.candidates && d.candidates.length > 0) {
            var ans = d.candidates[0].content.parts[0].text.trim();
            document.getElementById('t').innerText = ans;
            lt = ans;
            ll = l == 'en-US' ? 'vi-VN' : 'en-US';
            if (l == 'vi-VN') spk(ans, 'en-US');
            success = true;
            break;
          } else {
            lastErr = (d.error && d.error.message) ? d.error.message : ("Mã lỗi " + r.status);
          }
        } catch(x) {
          lastErr = x.message;
        }
      }
      if (!success) {
        document.getElementById('t').innerText = "Máy chủ đang bận (" + lastErr + "). Bấm nói lại nhé!";
      }
    }, 600);
  };
  rc.onerror=function(e){
    document.getElementById('bE').classList.remove('rec');document.getElementById('bV').classList.remove('rec');
    document.getElementById('o').innerText="Lỗi mic: "+e.error;
  };
  rc.start();
}

var cat=0,idx=0;

function render(){
  var it=data[cat][idx];
  document.getElementById('viMean').innerText=it.vi;
  document.getElementById('enTxt').innerText=it.en;
  document.getElementById('phonTxt').innerText=it.ph;
  document.getElementById('cnt').innerText=(idx+1)+"/"+data[cat].length;
  document.getElementById('resTxt').innerText="Bấm nút xanh và đọc to câu tiếng Anh ở trên";
  document.getElementById('resTxt').style.color="#ccc";
}
function setCat(c,el){
  cat=c;idx=0;
  document.querySelectorAll('#v2 .tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');render();
}
function move(s){
  idx+=s;
  if(idx<0)idx=data[cat].length-1;
  if(idx>=data[cat].length)idx=0;
  render();
}
function playV(r){
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(data[cat][idx].en);
  u.lang='en-US';u.rate=r;window.speechSynthesis.speak(u);
}
function chkSpk(){
  if(!rc)return alert("Mở bằng Safari trên iPhone!");
  var b=document.getElementById('micBtn'),rs=document.getElementById('resTxt');
  b.classList.add('rec');b.innerText="👂 Đang nghe bạn đọc...";rs.innerText="Hãy đọc rõ ràng câu tiếng Anh...";
  try{rc.abort()}catch(e){}
  rc.lang='en-US';
  rc.onresult=function(e){
    b.classList.remove('rec');b.innerText="🎤 Bấm để đọc thử";
    var sp=e.results.item(0).item(0).transcript;
    var tg=data[cat][idx].en.toLowerCase().replace(/[^a-z0-9 ]/g,"");
    var cs=sp.toLowerCase().replace(/[^a-z0-9 ]/g,"");
    var tw=tg.split(" "),m=0;
    tw.forEach(w=>{if(cs.indexOf(w)!==-1)m++});
    var sc=Math.round((m/tw.length)*100);
    if(sc>=80){rs.style.color="#4cd964";rs.innerText="🎉 Tuyệt vời ("+sc+"%): \""+sp+"\""}
    else if(sc>=50){rs.style.color="#ffd60a";rs.innerText="👍 Khá tốt ("+sc+"%): \""+sp+"\". Thử lại chút nữa!"}
    else{rs.style.color="#ff453a";rs.innerText="😅 Chưa rõ ("+sc+"%): \""+sp+"\". Bấm Nghe Chậm nhé!"}
  };
  rc.onerror=function(){b.classList.remove('rec');b.innerText="🎤 Bấm để đọc thử";rs.innerText="Không nghe rõ, bạn hãy bấm và đọc lại nhé."};
  rc.start();
}
render();
</script>
