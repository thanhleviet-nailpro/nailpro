<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nail Pro</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:4px 10px env(safe-area-inset-bottom);background:#09090b;color:#ffffff;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:2px;border-bottom:1px solid #27272a}
/* Thiết kế lại 2 Tab chính trên cùng - To rõ, viền nổi bật */
.mode-bar{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 0;background:#18181b;padding:3px;border-radius:10px;border:1px solid #3f3f46}
.m-btn{background:transparent;color:#a1a1aa;border:1px solid transparent;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:800;letter-spacing:0.3px;transition:0.15s}
.m-btn.on{background:#ff2d55;color:#ffffff;border-color:#ff8fa3;box-shadow:0 4px 12px rgba(255,45,85,0.4)}
.view{display:none;flex:1;flex-direction:column;overflow:hidden}
.view.on{display:flex}
/* Khung hiển thị chữ tương phản cao */
.box{flex:1;background:#18181b;border-radius:14px;padding:10px 12px;margin-bottom:4px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;border:2px solid #3f3f46}
.orig{font-size:17px;color:#e4e4e7;margin:4px 0 8px;line-height:1.35}
.trans{font-size:24px;font-weight:800;color:#00f5d4;line-height:1.3}
/* Thiết kế lại Tab 1, 2, 3 - Viền rõ, màu Vàng Hổ Phách chống chói */
.tabs{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;flex-shrink:0}
.tab{flex:1;background:#18181b;color:#d4d4d8;border:2px solid #52525b;padding:12px 8px;border-radius:12px;font-size:14px;font-weight:800;white-space:nowrap;text-align:center}
.tab.on{background:#ffb703;color:#000000;border-color:#ffffff;box-shadow:0 3px 10px rgba(255,183,3,0.35)}
/* Nút câu mẫu & Bảng giá cỡ đại */
.list{display:none;flex-wrap:wrap;gap:8px;height:145px;overflow-y:auto;align-content:flex-start;flex-shrink:0;padding-right:2px}
.list.on{display:flex}
.chip{background:#27272a;color:#ffffff;border:2px solid #52525b;padding:11px 13px;border-radius:12px;font-size:14px;font-weight:700}
.chip:active{background:#00f5d4;color:#000000;border-color:#ffffff}
.chip.on{background:#00f5d4!important;color:#000000!important;border-color:#ffffff!important;box-shadow:0 0 12px rgba(0,245,212,0.6)}
/* Nút Micro to rõ dễ bấm */
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:2px 0 0;flex-shrink:0}
.nav{display:flex;gap:10px;padding:6px 0 4px;flex-shrink:0}
.nav{display:flex;gap:10px;padding:8px 0 14px;flex-shrink:0}
.mic{border:2px solid rgba(255,255,255,0.3);border-radius:16px;padding:18px 10px;font-size:17px;font-weight:800;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.4)}
.rec{background:#ff9f0a!important;color:#000000!important;border-color:#ffffff!important}
/* Giao diện thẻ Luyện Nói */
.card{flex:1;background:#18181b;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid #3f3f46;overflow-y:auto}
.vi-m{font-size:16px;color:#ffb703;font-weight:700}
.en-t{font-size:24px;font-weight:800;color:#ffffff;margin:8px 0;line-height:1.3}
.phon{font-size:17px;color:#00f5d4;background:#09090b;padding:10px 12px;border-radius:12px;border:2px solid #27272a;border-left:5px solid #00f5d4}
.aud-r{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.b-aud{background:#27272a;color:#ffffff;border:2px solid #52525b;padding:14px;border-radius:12px;font-size:15px;font-weight:800}
.b-aud:active{background:#00f5d4;color:#000000}
.prac{margin-top:12px;background:#09090b;padding:12px;border-radius:14px;text-align:center;border:1px solid #27272a}
.b-mic{width:100%;background:#0a84ff;color:#ffffff;border:2px solid #60a5fa;padding:16px;border-radius:14px;font-size:17px;font-weight:800}
.b-mic.rec{background:#ff9f0a;color:#000000;border-color:#ffffff}
.res-t{margin-top:8px;font-size:14px;min-height:22px;color:#e4e4e7;font-weight:600}
.nav{display:flex;gap:10px;padding:8px 0 6px;flex-shrink:0}
.b-nav{flex:1;background:#27272a;color:#ffffff;border:2px solid #52525b;padding:15px;border-radius:14px;font-size:16px;font-weight:800}
.b-nav:active{background:#ffb703;color:#000000}
/* Cửa sổ nhập Key */
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);padding:20px;justify-content:center;align-items:center;z-index:99}
.mb{background:#18181b;padding:22px;border-radius:16px;width:100%;max-width:350px;border:2px solid #52525b}
input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:2px solid #52525b;background:#09090b;color:#ffffff;font-size:16px;font-weight:bold}
/* Hiệu ứng nháy sáng khi chạm vào các nút ở Tab Luyện Nói */
.b-aud, .b-nav, .b-mic { transition: transform 0.1s, background-color 0.1s, box-shadow 0.1s; }
.b-aud:active, .b-nav:active {
  background: #00f5d4 !important;
  color: #000000 !important;
  border-color: #ffffff !important;
  box-shadow: 0 0 15px rgba(0, 245, 212, 0.8) !important;
  transform: scale(0.96);
}
.b-mic:active {
  background: #ffb703 !important;
  color: #000000 !important;
  border-color: #ffffff !important;
  box-shadow: 0 0 15px rgba(255, 183, 3, 0.8) !important;
  transform: scale(0.96);
}
.flash{background:#00f5d4!important;color:#000000!important;border-color:#ffffff!important;box-shadow:0 0 18px rgba(0,245,212,0.9)!important;transform:scale(0.95)!important}
</style>
</head>

<div id="md"><div class="mb"><b>Nhập Gemini API Key</b><input type="password" id="ki" placeholder="AIzaSy..."><button onclick="saveM()" style="width:100%;padding:10px;background:#30d158;border:none;border-radius:8px;font-weight:bold">Lưu lại</button></div></div>

<script>
var lt="",ll="en-US",SR=window.SpeechRecognition||window.webkitSpeechRecognition,rc=SR?new SR():null;
function setMode(m){
  document.getElementById('m1').classList.toggle('on',m===1);
  document.getElementById('m2').classList.toggle('on',m===2);
  document.getElementById('v1').classList.toggle('on',m===1);
  document.getElementById('v2').classList.toggle('on',m===2);
}
function tab(n,e){
  document.querySelectorAll('#v1 .list').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('#v1 .tab').forEach(x=>x.classList.remove('on'));
  document.getElementById('t'+n).classList.add('on');e.classList.add('on');
}
function openM(){document.getElementById('ki').value=localStorage.getItem('gk')||'';document.getElementById('md').style.display='flex'}
function saveM(){
  var cleanKey = document.getElementById('ki').value.replace(/\s+/g, '');
  localStorage.setItem('gk', cleanKey);
  document.getElementById('md').style.display='none';
  alert("Đã lưu Key sạch sẽ!");
}
function spk(x,l){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(x);u.lang=l;u.rate=.95;window.speechSynthesis.speak(u)}
function reSpk(){if(lt)spk(lt,ll)}
function say(e, v, el){
  document.getElementById('o').innerText = v;
  document.getElementById('t').innerText = e;
  lt = e;
  ll = 'en-US';
  spk(e, 'en-US');
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  if (el) el.classList.add('on');
}
function quotePrice(amount, el){
  if(!amount) return;
  var en = "Your total today is $" + amount + ". How would you like to pay? Cash or card?";
  var vi = "Tổng của bạn hôm nay là $" + amount + ". Bạn thanh toán tiền mặt hay thẻ?";
  say(en, vi, el);
}
function mic(l){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return alert("Hãy mở bằng trình duyệt Safari trên iPhone!");
  var k = (localStorage.getItem('gk')||'').replace(/\s+/g, '');
  if(!k) return openM();
  window.speechSynthesis.cancel();
  document.getElementById('bE').classList.remove('rec');
  document.getElementById('bV').classList.remove('rec');
  document.getElementById(l=='en-US'?'bE':'bV').classList.add('rec');
  document.getElementById('o').innerText = "Đang nghe... Hãy nói ngay!";
  document.getElementById('t').innerText = "...";
  var newRec = new SR();
  newRec.lang = l;
  newRec.continuous = false;
  newRec.interimResults = false;
  newRec.onresult = async function(e){
    var tx = e.results.item(0).item(0).transcript;
    document.getElementById('o').innerText = tx;
    document.getElementById('bE').classList.remove('rec');
    document.getElementById('bV').classList.remove('rec');
    var p = "Dịch sang " + (l=='en-US'?'Tiếng Việt':'Tiếng Anh Mỹ tiệm nail') + " (chỉ trả về câu dịch): " + tx;
    var domain = ["generativelanguage", "googleapis", "com"].join(".");
    var apiUrl = "https://" + domain + "/v1beta/models/gemini-3.5-flash-lite:generateContent?key=" + k;
    try {
      var r = await fetch(apiUrl, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({contents:[{parts:[{text:p}]}]})
      });
      var d = await r.json();
      if(!r.ok || d.error){
        var msg = (d.error && d.error.message) ? d.error.message : ("Mã lỗi " + r.status);
        document.getElementById('t').innerText = "Lỗi Google: " + msg;
        return;
      }
      var ans = d.candidates.shift().content.parts.shift().text.trim();
      document.getElementById('t').innerText = ans;
      lt = ans;
      ll = l=='en-US'?'vi-VN':'en-US';
      if(l=='vi-VN') spk(ans, 'en-US');
    } catch(x) {
      document.getElementById('t').innerText = "Lỗi mạng: " + x.message;
    }
  };
  newRec.onerror = function(e){
    document.getElementById('bE').classList.remove('rec');
    document.getElementById('bV').classList.remove('rec');
    if(e.error === 'aborted') {
      document.getElementById('o').innerText = "Lỗi ngắt mic: Hãy vào Cài đặt iPhone -> Bàn phím -> Bật Đọc chính tả!";
    } else {
      document.getElementById('o').innerText = "Lỗi mic: " + e.error;
    }
  };
  newRec.onend = function(){
    document.getElementById('bE').classList.remove('rec');
    document.getElementById('bV').classList.remove('rec');
  };
  newRec.start();
}
var data=[

  [

    {vi:"Bạn có muốn mình cắt da kỹ không?",en:"Would you like me to trim your cuticles closely?",ph:"Quút diu lai mi tu trim gio kiu-ti-cồ cờ-lâu-li?"},
    {vi:"Bạn có móng chân quặp nào bị đau không?",en:"Do you have any ingrown toenails that bother you?",ph:"Đu diu hép e-ni in-gờ-râu thâu-neo đát bo-đờ diu?"},
    {vi:"Bạn có muốn chà gót và tẩy tế bào chết bằng đường không?",en:"Would you like callus removal and a sugar scrub?",ph:"Quút diu lai ca-lớt ri-mu-vồ en ơ su-gờ sờ-cờ-rắp?"},
    {vi:"Bạn có muốn mát-xa đá nóng hay ủ sáp nến ấm không?",en:"Would you like a hot stone massage or paraffin wax?",ph:"Quút diu lai ơ hót xờ-tôn mát-xa o pa-ra-phin quắc-xờ?"},
    {vi:"Lực bóp mát-xa như vậy đã vừa với bạn chưa?",en:"Is the massage pressure good for you?",ph:"I đờ mát-xa pờ-rét-sờ gút pho diu?"}

var cat=0,idx=0;

function render(){
  var it=data[cat][idx];
  document.getElementById('viMean').innerText=it.vi;
  document.getElementById('enTxt').innerText=it.en;
  document.getElementById('phonTxt').innerText=it.ph;
  document.getElementById('cnt').innerText=(idx+1)+"/"+data[cat].length;
  document.getElementById('resTxt').innerText="Bấm nút xanh và đọc to câu tiếng Anh ở trên";
  document.getElementById('resTxt').style.color="#ccc";
}
function setCat(c,el){
  cat=c;idx=0;
  document.querySelectorAll('#v2 .tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');render();
}
function move(s){
  idx+=s;
  if(idx<0)idx=data[cat].length-1;
  if(idx>=data[cat].length)idx=0;
  render();
}
function playV(r){
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(data[cat][idx].en);
  u.lang='en-US';u.rate=r;window.speechSynthesis.speak(u);
}
function chkSpk(){
  if(!rc)return alert("Mở bằng Safari trên iPhone!");
  var b=document.getElementById('micBtn'),rs=document.getElementById('resTxt');
  b.classList.add('rec');b.innerText="👂 Đang nghe bạn đọc...";rs.innerText="Hãy đọc rõ ràng câu tiếng Anh...";
  try{rc.abort()}catch(e){}
  rc.lang='en-US';
  rc.onresult=function(e){
    b.classList.remove('rec');b.innerText="🎤 Bấm để đọc thử";
    var sp=e.results.item(0).item(0).transcript;
    var tg=data[cat][idx].en.toLowerCase().replace(/[^a-z0-9 ]/g,"");
    var cs=sp.toLowerCase().replace(/[^a-z0-9 ]/g,"");
    var tw=tg.split(" "),m=0;
    tw.forEach(w=>{if(cs.indexOf(w)!==-1)m++});
    var sc=Math.round((m/tw.length)*100);
    if(sc>=80){rs.style.color="#4cd964";rs.innerText="🎉 Tuyệt vời ("+sc+"%): \""+sp+"\""}
    else if(sc>=50){rs.style.color="#ffd60a";rs.innerText="👍 Khá tốt ("+sc+"%): \""+sp+"\". Thử lại chút nữa!"}
    else{rs.style.color="#ff453a";rs.innerText="😅 Chưa rõ ("+sc+"%): \""+sp+"\". Bấm Nghe Chậm nhé!"}
  };
  rc.onerror=function(){b.classList.remove('rec');b.innerText="🎤 Bấm để đọc thử";rs.innerText="Không nghe rõ, bạn hãy bấm và đọc lại nhé."};
  rc.start();
}
render();
document.querySelectorAll('.b-aud, .b-nav, .b-mic, .mic').forEach(function(btn){
  btn.addEventListener('touchstart', function(){
    var el = this;
    el.classList.add('flash');
    setTimeout(function(){ el.classList.remove('flash'); }, 250);
  }, {passive: true});
});
</script>
